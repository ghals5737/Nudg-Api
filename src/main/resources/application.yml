spring:
  application:
    name: nudg-api

  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

server:
  port: 4000

jwt:
  secret: ${JWT_SECRET:nudg-dev-secret-key-minimum-256-bits-please-change-in-production-env}
  access-token-expiry: 900
  refresh-token-expiry: 604800

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
